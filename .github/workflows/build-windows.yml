name: Windows Release (NSIS + Updater)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v4-development
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate signing configuration and synchronize version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATER_PUBLIC_KEY) { throw 'Set repository variable TAURI_UPDATER_PUBLIC_KEY (contents of generated public key).' }
          if (-not $env:SIGNING_PRIVATE_KEY) { throw 'Set repository secret TAURI_SIGNING_PRIVATE_KEY.' }
          $version = '${{ github.ref_name }}' -replace '^v',''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version tag: $version" }
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $version
          $config.plugins.updater.pubkey = $env:UPDATER_PUBLIC_KEY
          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8
          $pkgPath = 'package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 100 | Set-Content -Path $pkgPath -Encoding utf8

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and frontend build
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build NSIS for branch/manual tests
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload test installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: MyArticleManager-Windows-NSIS-Test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish signed NSIS installer and updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MyArticleManager ${{ github.ref_name }}
          releaseBody: Windows NSIS installer and signed automatic update assets.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

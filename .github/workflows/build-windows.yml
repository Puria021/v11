name: Windows Release (NSIS + Updater)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v4-development
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Update host: latest.json lives at the root, installers under /downloads/.
  UPDATE_BASE_URL: https://update.codeappmaster.ir
  # GitHub repository that keeps an archive copy of each release (optional, needs RELEASES_TOKEN).
  RELEASES_REPO: Puria021/seo-master-releases

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate signing configuration and synchronize version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:UPDATER_PUBLIC_KEY) { throw 'Set repository variable TAURI_UPDATER_PUBLIC_KEY (contents of generated public key).' }
          if (-not $env:SIGNING_PRIVATE_KEY) { throw 'Set repository secret TAURI_SIGNING_PRIVATE_KEY.' }
          $version = '${{ github.ref_name }}' -replace '^v',''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid version tag: $version" }
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $version
          $config.plugins.updater.pubkey = $env:UPDATER_PUBLIC_KEY
          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8
          $pkgPath = 'package.json'
          $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 100 | Set-Content -Path $pkgPath -Encoding utf8

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and frontend build
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --no-fail-fast -- --test-threads=1

      - name: Build config (Authenticode only when a certificate is configured)
        id: cfg
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Updater signature (.sig) only for tag releases; test builds skip it so they produce an installer without the signing key.
          $bundle = @{ createUpdaterArtifacts = ($env:IS_TAG -eq 'true') }
          $signed = $false
          if ($env:WINDOWS_CERT_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'seo-master-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            "SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/sign-windows.ps1'
            $bundle.windows = @{ signCommand = "pwsh -NoProfile -ExecutionPolicy Bypass -File `"$script`" `"%1`"" }
            $signed = $true
          }
          $cfgPath = Join-Path $env:RUNNER_TEMP 'tauri-build-config.json'
          @{ bundle = $bundle } | ConvertTo-Json -Depth 10 | Set-Content -Path $cfgPath -Encoding utf8
          "config=$cfgPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signed=$($signed.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Authenticode signing: $signed"

      - name: Build NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run tauri build -- --bundles nsis --config "${{ steps.cfg.outputs.config }}"

      - name: Upload test installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: MyArticleManager-Windows-NSIS-Test
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

      - name: Build updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        id: manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installer not found.' }
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "Updater signature missing: $sigPath" }
          $url = "$env:UPDATE_BASE_URL/downloads/$([uri]::EscapeDataString($setup.Name))"
          $manifest = [ordered]@{
            version  = $version
            notes    = "نسخه $version"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{ signature = (Get-Content $sigPath -Raw).Trim(); url = $url }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path latest.json -Encoding utf8
          "installer=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature=$sigPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload release files (for the update host)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.manifest.outputs.version }}
          path: |
            ${{ steps.manifest.outputs.installer }}
            ${{ steps.manifest.outputs.signature }}
            latest.json
          if-no-files-found: error

      - name: Upload to the update host over FTP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_USE_SSL: ${{ secrets.FTP_USE_SSL }}
          INSTALLER: ${{ steps.manifest.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:FTP_HOST) {
            Write-Host 'FTP_HOST is not set; upload latest.json and the installer to the host manually.'
            exit 0
          }
          $useSsl = $env:FTP_USE_SSL -eq 'true'
          $remoteRoot = $env:FTP_REMOTE_DIR.TrimEnd('/')

          function Invoke-Ftp {
            param([string]$Method, [string]$RemotePath, [string]$LocalFile)
            $uri = "ftp://$($env:FTP_HOST)/$RemotePath"
            $req = [System.Net.FtpWebRequest]::Create($uri)
            $req.Method = $Method
            $req.Credentials = New-Object System.Net.NetworkCredential($env:FTP_USER, $env:FTP_PASSWORD)
            $req.UsePassive = $true
            $req.UseBinary = $true
            $req.EnableSsl = $useSsl
            if ($Method -eq [System.Net.WebRequestMethods+Ftp]::UploadFile) {
              $bytes = [System.IO.File]::ReadAllBytes($LocalFile)
              $req.ContentLength = $bytes.Length
              $stream = $req.GetRequestStream()
              $stream.Write($bytes, 0, $bytes.Length)
              $stream.Close()
            }
            $resp = $req.GetResponse()
            $resp.Close()
          }

          # Create the downloads folder if it does not exist yet (an error here usually means it already exists).
          try { Invoke-Ftp ([System.Net.WebRequestMethods+Ftp]::MakeDirectory) "$remoteRoot/downloads" $null } catch { Write-Host 'downloads folder already exists.' }

          # Installer first; latest.json last, so clients never see a manifest that points to a missing file.
          $installerName = [System.IO.Path]::GetFileName($env:INSTALLER)
          Invoke-Ftp ([System.Net.WebRequestMethods+Ftp]::UploadFile) "$remoteRoot/downloads/$installerName" $env:INSTALLER
          Invoke-Ftp ([System.Net.WebRequestMethods+Ftp]::UploadFile) "$remoteRoot/latest.json" (Join-Path $env:GITHUB_WORKSPACE 'latest.json')
          Write-Host "Uploaded $installerName and latest.json to $env:UPDATE_BASE_URL"

      - name: Archive release on GitHub (optional)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
          INSTALLER: ${{ steps.manifest.outputs.installer }}
          SIGNATURE: ${{ steps.manifest.outputs.signature }}
        run: |
          if (-not $env:GH_TOKEN) { Write-Host 'RELEASES_TOKEN not set; skipping the GitHub archive.'; exit 0 }
          gh release create "v$env:VERSION" $env:INSTALLER $env:SIGNATURE latest.json `
            --repo $env:RELEASES_REPO `
            --title "SEO Master v$env:VERSION" `
            --notes "نسخه‌ی $env:VERSION"
